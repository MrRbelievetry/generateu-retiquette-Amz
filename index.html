<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label Maker V4.1</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <main class="app">
    <section class="card">
      <header class="hero">
        <h1>Label Maker V4.1</h1>
      </header>

      <div class="field">
        <label for="platform">Source du PDF</label>
        <select id="platform">
          <option value="amazon">Amz</option>
          <option value="ebay">Ebay</option>
          <option value="hennd">HennD</option>
        </select>
      </div>

      <div class="field">
        <label for="pdfFile">PDF source</label>
        <input id="pdfFile" type="file" accept="application/pdf">
      </div>

      <fieldset class="sender">
        <legend>Adresse expéditeur</legend>
        <input id="sender1" type="text" value="Expéditeur : Entreprise Rebai">
        <input id="sender2" type="text" value="Lieu dit la Planche">
        <input id="sender3" type="text" value="89350 Villeneuve les genets">
        <input id="sender4" type="text" value="FRANCE">
      </fieldset>

      <label class="check">
        <input id="crossSender" type="checkbox" checked>
        Barrer l'adresse expéditeur
      </label>

      <button id="generateBtn">Générer les étiquettes</button>

      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="app.js?v=4.1"></script>
</body>
</html>
