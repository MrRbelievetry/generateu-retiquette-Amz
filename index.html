<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Label Maker V3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="header">
        <h1>Label Maker V3</h1>
      </div>

      <div class="field">
        <label for="pdfFile">PDF Amazon source</label>
        <input id="pdfFile" type="file" accept="application/pdf,.pdf" />
      </div>

      <fieldset class="sender-box">
        <legend>Adresse expéditeur</legend>
        <input id="sender1" type="text" value="Expéditeur : Entreprise Rebai" />
        <input id="sender2" type="text" value="Lieu dit la Planche" />
        <input id="sender3" type="text" value="89350 Villeneuve les genets" />
        <input id="sender4" type="text" value="FRANCE" />
      </fieldset>

      <label class="checkline">
        <input id="crossSender" type="checkbox" checked />
        Encadrer et barrer la zone expéditeur
      </label>

      <div class="actions">
        <button id="generateBtn" type="button">Générer les étiquettes</button>
        <button id="resetSenderBtn" type="button" class="secondary">Réinitialiser l’expéditeur</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section class="card muted">
      <h2>Fonctionnement</h2>
      <p>Tout se fait dans votre navigateur : le PDF n’est pas envoyé sur un serveur.</p>
      <p>Votre adresse expéditeur est mémorisée automatiquement sur ce navigateur.</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
